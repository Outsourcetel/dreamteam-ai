name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# CI MUST NOT BE GREEN WHEN IT DID NOT RUN.
#
# The previous version of this file self-skipped the integration tests with
# `exit 0` when secrets were missing, so the tenant-isolation suite — the only
# automated cross-tenant safety net in the project — reported a green tick
# whether or not a single test executed. That is worse than having no CI: it
# manufactures confidence. An independent audit flagged it, correctly, as
# "a skipped integration job reported as a passing security test".
#
# Every job below either runs its checks or FAILS. There is no third state.
# ============================================================

jobs:
  build:
    name: Typecheck, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # `npm run build` is `tsc --noEmit && vite build` — the typecheck is
      # the real gate and needs no secrets (VITE_* only affect runtime).
      - run: npm run build
      # Pure unit tests: no database, no secrets, no excuse to skip them.
      # Widened from ONE file to THREE. contract-parity in particular is the
      # only guard on the browser/edge twin copies and ran in no automation.
      # NOT four: approval-learning-capture LOOKS offline and is not — it
      # imports helpers/testTenant -> setup.ts, which throws without .env.test.
      # That was caught by running certify in a real credential-free clone;
      # locally it passes, because this machine has the file. Anything added
      # here must be proven in a clone, never on a developer's box.
      - run: npm run test:unit

      # ── The real gate, minus what needs credentials ──────────────────────
      # certify has nine sections; four need nothing but this checkout. Those
      # four ran on nobody's machine automatically until now: in the 30 days
      # before this was added there were 855 commits and 15 recorded runs.
      # The banner it prints says explicitly that this is a SUBSET and names
      # how many sections did not run, so a green tick here can never be
      # mistaken for a full certification.
      - run: npm run certify:offline

      # ── Security: what we SHIP must be clean ────────────────────────────
      # Split deliberately by blast radius. Production dependencies are the
      # code that reaches a customer's browser, so a HIGH there fails the
      # build. The toolchain (vite/esbuild/postcss dev-server advisories) is a
      # developer-machine risk, not a shipped one, and its fix is a MAJOR vite
      # upgrade — so it REPORTS rather than blocks, and is scheduled work
      # rather than a permanently red tick everyone learns to ignore.
      #
      # ⚠ READ THE GATE HONESTLY. Green here means "no HIGH advisory in shipped
      # code". It does NOT mean "nothing vulnerable reaches customers":
      # react-router currently carries two MODERATE browser-runtime advisories
      # (open redirect via backslash in <Link>/useNavigate) and IS shipped. The
      # threshold hides them, not the --omit=dev split. Their fix is
      # react-router v7 — a major upgrade from ^6.22.0 — so it is scheduled
      # work, recorded in docs/47, not something to quietly bury.
      - run: npm run audit
      - name: Toolchain advisories (report only)
        run: npm run audit:toolchain || true

  isolation:
    name: Tenant-isolation tests (live, dev project)
    runs-on: ubuntu-latest
    needs: build
    env:
      VITE_TEST_SUPABASE_URL: ${{ secrets.VITE_TEST_SUPABASE_URL }}
      VITE_TEST_SUPABASE_ANON_KEY: ${{ secrets.VITE_TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Require secrets
        # Shape, not just presence. See scripts/ci-require-secrets.sh for why
        # a value that is merely non-empty is not a value that works.
        run: bash scripts/ci-require-secrets.sh isolation
      - run: npm run test:isolation

  invariants:
    name: Knowledge ACL invariants (live catalog, read-only)
    runs-on: ubuntu-latest
    needs: build
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Require token
        # Shape, not just presence. See scripts/ci-require-secrets.sh for why
        # a value that is merely non-empty is not a value that works.
        run: bash scripts/ci-require-secrets.sh invariants
      - run: npm run test:invariants

  golden-path:
    name: Golden path (the product, as an executable trace — dev project)
    runs-on: ubuntu-latest
    needs: build
    # ⚠ SHARED WITH .github/workflows/dev-rebuild.yml. That job DROPS and
    # recreates dev's public schema; this one signs up a tenant and drives the
    # whole loop against it. Concurrently, one of them is working against a
    # schema disappearing underneath it. Same group serialises them, and
    # cancel-in-progress is false so the loser queues instead of being
    # discarded — a cancelled rebuild could leave dev emptied and not restored.
    concurrency:
      group: dev-project
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VITE_TEST_SUPABASE_URL: ${{ secrets.VITE_TEST_SUPABASE_URL }}
      VITE_TEST_SUPABASE_ANON_KEY: ${{ secrets.VITE_TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # audit:replayable diffs origin/main...HEAD to find migrations this
          # branch ADDS. checkout defaults to depth 1, where that diff finds
          # nothing and the gate passes every time without checking anything —
          # a gate that cannot fail, which is the shape this repo has paid for
          # before. Full history is what makes the comparison real.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Require credentials
        # Shape, not just presence. See scripts/ci-require-secrets.sh for why
        # a value that is merely non-empty is not a value that works.
        run: bash scripts/ci-require-secrets.sh golden-path
      # ── Bring dev as close to production as it can get, FIRST ──────────────
      # golden-path proves whatever schema dev happens to have, so without this
      # a green tick can be proving a schema weeks old (register B-6: dev was
      # 147 migrations behind in August, and drifts again within days because
      # production is written to constantly from several sessions at once).
      #
      # --best-effort, deliberately. Three migrations in this repo assert on
      # production DATA and can NEVER apply to an empty dev, so a strict run
      # would leave CI permanently red and be routed around within a week. This
      # applies what it can and raises a ::warning:: naming each one it cannot,
      # so the shortfall lands on the run summary rather than only in a log.
      #
      # It still FAILS hard on a pending migration with no source file — that is
      # register B-10, a repository problem rather than an environment one, and
      # it means main can no longer rebuild production.
      - name: Sync dev to production (best effort)
        run: node scripts/sync-dev-migrations.mjs --apply --best-effort
      # ── A new migration must be able to run somewhere that is not production ─
      # Runs AFTER the sync so the dry run happens against a current dev — a
      # migration can also fail there for the boring reason that dev is missing
      # something it depends on, and that would be a false accusation.
      #
      # HARD FAIL, unlike the sync above. The three existing unreplayable
      # migrations cannot be repaired — the ledger keys on filename and
      # checksum, so editing an applied file breaks certify — which makes the
      # moment before merge the only moment this is fixable. A warning here
      # would be a warning about the one thing that is still cheap to fix.
      #
      # Only migrations this branch ADDS are checked, so the known three do not
      # fail every run and train everyone to ignore the job.
      - name: New migrations must be replayable
        run: npm run audit:replayable
      - run: node scripts/golden-path.mjs
